<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No.5</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="custom">
        <h2>ข้อมูลติดต่อ:</h2>
        
        <form action="" >
            <label for="" id="">ชื่อ:</label>
            <input type="text" value="" id="textname">
            <label for="" id="">นามสกุล:</label>
            <input type="text" value="" id="textlastname">
            <label for="" id="">เบอร์โทรศัพท์:</label>
            <input type="text" name="" id="number">
        
             <button onclick="addData(event)">Add</button>
        </form>
            
        

       
    </div>

    <table id="table" border="1" style="border-collapse: collapse; margin-top: 40px;">
      
    </table>

    <script>
        
        function addData(event) {
            event.preventDefault()       
            fname = document.getElementById('textname').value.trim()
            lname = document.getElementById('textlastname').value.trim()
            num = document.getElementById('number').value.trim()
            table = document.getElementById('table')
            
            if(!fname | !lname | !num){
                return
            }

           if(table.rows.length === 0){
                const headRow = table.insertRow();
                const th1 = document.createElement('th')
                const th2 = document.createElement('th')
                const th3 = document.createElement('th')
                th1.textContent = 'ชื่อ'
                th2.textContent = 'นามสกุล'
                th3.textContent = 'เบอร์โทรศัพท์'
                headRow.appendChild(th1)
                headRow.appendChild(th2)
                headRow.appendChild(th3)
            }
            
            const dataRow = table.insertRow()
            const data1 = dataRow.insertCell()
            const data2 = dataRow.insertCell()
            const data3 = dataRow.insertCell()
            data1.textContent =  fname
            data2.textContent =  lname
            data3.textContent =  num

            fname = document.getElementById('textname').value = ''
            lname = document.getElementById('textlastname').value = ''
            num = document.getElementById('number').value = ''
        }
    </script>

            
            
        
    </script>
</body>
</html>
