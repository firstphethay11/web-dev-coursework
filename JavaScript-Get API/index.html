<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
         
         
         #temperature {
            font-size: 50px;  /* ขยายขนาดฟอนต์อุณหภูมิ */
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #temperature img {
            width: 80px;   /* ปรับขนาดไอคอน */
            height: 80px;
        }

        #description{
             font-size: 20px;
        }


    </style>

</head>
<body style="display: flex; flex-direction: column; justify-content: center; align-items: center;"> 
    <div style="border: 1px solid red; width: 400px; height: 300px; border-radius: 10%; background-color: aqua;
    display: flex; flex-direction: column; justify-content: center; align-items: center;">
        
    <div style="font-size: 20px; color: red;" id="date"></div>
    <div style="font-size: 20px;" id="timezone"></div>
    <div  id="temperature"></div>
    <div id="description"></div>



    <script>
        function showDate(){
            const now = new Date();
            document.getElementById('date').textContent = now.toLocaleDateString(
                'en-EN',{weekday:"long",year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute: '2-digit'

                })
        }

        showDate();

          setInterval(showDate,1000); 

       
        const apiKey = "f5aff27b8a2f72928b971c9e2b08b4cc";
        const lat = 13.736717;
        const lon = 100.523186;
        const url = `https://api.openweathermap.org/data/3.0/onecall?lat=${lat}&lon=${lon}&exclude=minutely,hourly,daily,alerts&units=metric&appid=${apiKey}`;

        async function loadWeather(){
            try {
                const res = await fetch(url);
                if(!res.ok) throw new Error("โหลดข้อมูลไม่ได้");
                const data = await res.json();

                
                document.getElementById("timezone").textContent = " " + data.timezone;

                
                const current = data.current;
                const weather = current.weather[0];
                const iconUrl = `https://openweathermap.org/img/wn/${weather.icon}.png`;
                document.getElementById("temperature").innerHTML =
                    `<img src="${iconUrl}" alt="icon"> ${current.temp.toFixed(1)} °C`;

               
                document.getElementById("description").textContent = 
                    weather.description.charAt(0).toUpperCase() + weather.description.slice(1);

            } catch(err){
                console.error(err);
                document.getElementById("timezone").textContent = "Error loading data";
            }
        }

        loadWeather();
    </script>

    </div>
</body>
</html>
